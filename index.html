<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Micro-Jection 계약 협의 안건</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --line:#d8dee7; --line2:#e8edf3;
    --ink:#12161c; --ink2:#454f5c; --ink3:#6b7684;
    --accent:#1a4fd6; --accent-soft:#eaf0ff;
    --red:#c62828; --red-soft:#fdecec;
    --amber:#a06a00; --amber-soft:#fff5e0;
    --green:#0e7a3c; --green-soft:#e6f6ec;
    --purple:#6b2fb5; --purple-soft:#f2ebfd;
    --fs:19px;
  }
  *{box-sizing:border-box}
  html{font-size:var(--fs)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.62; -webkit-text-size-adjust:100%;
  }

  /* ---------- top bar ---------- */
  header{
    position:sticky; top:0; z-index:50; background:#fff;
    border-bottom:2px solid var(--line);
    box-shadow:0 2px 14px rgba(20,30,50,.07);
  }
  .bar{max-width:1680px; margin:0 auto; padding:.7rem 1.1rem; display:flex; align-items:center; gap:1rem; flex-wrap:wrap}
  .brand{display:flex; flex-direction:column; margin-right:auto}
  .brand h1{margin:0; font-size:1.35rem; letter-spacing:-.02em}
  .brand .sub{font-size:.82rem; color:var(--ink3); font-weight:600}
  .stats{display:flex; gap:.45rem; align-items:center; flex-wrap:wrap}
  .pill{
    font-size:.82rem; font-weight:800; padding:.3rem .7rem; border-radius:999px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink2); white-space:nowrap;
  }
  .pill.ok{background:var(--green-soft); border-color:#a9dcbd; color:var(--green)}
  .pill.hold{background:var(--amber-soft); border-color:#f0d091; color:var(--amber)}
  .pill.re{background:var(--purple-soft); border-color:#d6c2f0; color:var(--purple)}
  .btns{display:flex; gap:.4rem; flex-wrap:wrap}
  button.act{
    font-family:inherit; font-size:.86rem; font-weight:800; cursor:pointer;
    padding:.5rem .85rem; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink2);
  }
  button.act:hover{background:#f1f4f8}
  button.act.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.act.primary:hover{filter:brightness(1.08)}
  button.act.danger{color:var(--red); border-color:#f0c2c2}
  .saved{font-size:.78rem; color:var(--ink3); font-weight:700; min-width:9.5rem}

  /* ---------- layout ---------- */
  main{max-width:1680px; margin:0 auto; padding:1.1rem 1.1rem 5rem}

  .memoboard{
    background:#fff; border:2px solid var(--accent); border-radius:14px;
    padding:.9rem 1rem; margin-bottom:1.1rem;
  }
  .memoboard h2{margin:0 0 .5rem; font-size:1.05rem; color:var(--accent); letter-spacing:-.01em}
  .memoboard textarea{min-height:110px}

  /* ---------- accordion ---------- */
  section.acc{
    background:var(--panel); border:1.5px solid var(--line); border-radius:14px;
    margin-bottom:.75rem; overflow:hidden;
  }
  .acc > .head{
    width:100%; display:flex; align-items:center; gap:.8rem; cursor:pointer;
    padding:1rem 1.1rem; background:#fbfcfe; border:0; font-family:inherit;
    text-align:left; color:var(--ink);
  }
  .acc > .head:hover{background:#f3f6fb}
  .acc[open] > .head{background:#eef3fb; border-bottom:1.5px solid var(--line2)}
  .chev{font-size:1.05rem; color:var(--ink3); transition:transform .15s; flex:none}
  .acc[open] .chev{transform:rotate(90deg)}
  .head .t{font-size:1.28rem; font-weight:800; letter-spacing:-.02em; margin-right:auto}
  .head .cnt{font-size:.8rem; font-weight:800; color:var(--ink3); background:#fff;
    border:1.5px solid var(--line); border-radius:999px; padding:.2rem .6rem; flex:none}
  .body{padding:.4rem .8rem 1rem}

  /* ---------- item ---------- */
  .item{
    display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:1rem;
    padding:1rem .55rem; border-bottom:1.5px dashed var(--line2);
  }
  .item:last-child{border-bottom:0}
  .item.done{background:linear-gradient(90deg,var(--green-soft),transparent 65%)}
  .item.hold{background:linear-gradient(90deg,var(--amber-soft),transparent 65%)}
  .item.re{background:linear-gradient(90deg,var(--purple-soft),transparent 65%)}

  .no{font-size:.82rem; font-weight:900; color:#fff; background:var(--ink3);
    border-radius:7px; padding:.1rem .5rem; margin-right:.5rem}
  .tag{font-size:.76rem; font-weight:900; padding:.15rem .55rem; border-radius:7px;
    margin-right:.45rem; white-space:nowrap; display:inline-block; vertical-align:2px}
  .tag.d{background:var(--accent-soft); color:var(--accent)}
  .tag.c{background:var(--purple-soft); color:var(--purple)}
  .tag.k{background:var(--green-soft); color:var(--green)}
  .tag.s{background:var(--amber-soft); color:var(--amber)}

  .it-t{font-size:1.13rem; font-weight:800; letter-spacing:-.01em; margin:0 0 .4rem}
  .it-d{font-size:.97rem; color:var(--ink2); margin:0}
  .it-d ul,.it-d ol{margin:.35rem 0 0; padding-left:1.15rem}
  .it-d li{margin:.16rem 0}
  .it-d b{color:var(--ink)}
  .it-d .x{color:var(--red); font-weight:800}
  .it-d .o{color:var(--green); font-weight:800}
  .quote{
    margin:.5rem 0 0; padding:.5rem .75rem; background:#f7f9fc;
    border-left:4px solid var(--line); border-radius:0 8px 8px 0;
    font-size:.93rem; color:var(--ink2); white-space:pre-wrap;
  }
  .rec{
    margin-top:.55rem; display:inline-block; font-size:.95rem; font-weight:800;
    background:var(--accent-soft); color:var(--accent);
    border:1.5px solid #c3d4ff; border-radius:9px; padding:.28rem .7rem;
  }

  /* ---------- memo side ---------- */
  .side{display:flex; flex-direction:column; gap:.45rem; min-width:0}
  .status{display:flex; gap:.3rem}
  .st{
    flex:1; font-family:inherit; font-size:.86rem; font-weight:800; cursor:pointer;
    padding:.42rem .2rem; border-radius:9px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink3);
  }
  .st:hover{background:#f1f4f8}
  .st[data-v="done"].on{background:var(--green); border-color:var(--green); color:#fff}
  .st[data-v="hold"].on{background:var(--amber); border-color:var(--amber); color:#fff}
  .st[data-v="re"].on{background:var(--purple); border-color:var(--purple); color:#fff}
  textarea{
    font-family:inherit; font-size:.97rem; line-height:1.55; color:var(--ink);
    width:100%; min-height:108px; resize:vertical; padding:.6rem .7rem;
    border:1.5px solid var(--line); border-radius:10px; background:#fffdf5;
  }
  textarea:focus{outline:none; border-color:var(--accent); background:#fff;
    box-shadow:0 0 0 3px rgba(26,79,214,.13)}
  textarea::placeholder{color:#a9b3c0}

  .foot{margin-top:1.5rem; font-size:.85rem; color:var(--ink3); text-align:center}

  @media (max-width:1180px){
    .item{grid-template-columns:1fr}
    .side{border-top:1.5px solid var(--line2); padding-top:.6rem}
  }
  @media print{
    header{position:static} .btns{display:none} .acc{break-inside:avoid}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <h1>Micro-Jection 특허 독점계약 · 협의 안건</h1>
      <div class="sub">주식회사 배랩 ↔ 크리에이티브 비범 · 2026.08.07 미팅 합의사항 기준 협의 정리</div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="btns">
      <button class="act" onclick="allOpen(true)">전체 펼치기</button>
      <button class="act" onclick="allOpen(false)">전체 접기</button>
      <button class="act primary" onclick="exportHTML()">HTML로 저장</button>
      <button class="act" onclick="window.print()">인쇄 / PDF</button>
      <button class="act danger" onclick="resetAll()">초기화</button>
    </div>
    <div class="saved" id="saved">—</div>
  </div>
</header>

<main>
  <div class="memoboard">
    <h2>회의 종합 메모</h2>
    <textarea id="global" placeholder="전체 흐름, 합의 사항, 다음 액션을 여기에 기록합니다."></textarea>
  </div>
  <div id="app"></div>
  <div class="foot">
    이 브라우저에 자동 저장됩니다 · 회의 종료 후 <b>HTML로 저장</b>을 눌러 결과 파일을 보관하세요<br>
    최종 조항 확정은 양측 법률 검토를 거쳐 진행합니다
  </div>
</main>

<script id="snapshot" type="application/json">null</script>

const TAGNAME = {k:"합의", d:"세부 조정", s:"논의 필요", c:"확인 요청"};
const KEY = "mj-meeting-v3";

/* ---------- render ---------- */
const app = document.getElementById("app");
app.innerHTML = "";   // 내보낸 파일을 다시 열었을 때 중복 렌더링 방지

DATA.forEach(sec=>{
  const el = document.createElement("section");
  el.className = "acc"; el.dataset.sec = sec.id;
  if(sec.open) el.setAttribute("open","");
  const rows = sec.items.map((it,i)=>{
    const uid = sec.id + "-" + i;
    return `
    <div class="item" data-uid="${uid}">
      <div class="main">
        <p class="it-t">${it.n?`<span class="no">${it.n}</span>`:""}<span class="tag ${it.tag}">${TAGNAME[it.tag]}</span>${it.t}</p>
        ${it.d?`<div class="it-d">${it.d}</div>`:""}
        ${it.rec?`<div class="rec">${it.rec}</div>`:""}
      </div>
      <div class="side">
        <div class="status">
          <button class="st" data-v="done" onclick="setStatus(this)">합의</button>
          <button class="st" data-v="re"   onclick="setStatus(this)">추가 논의</button>
          <button class="st" data-v="hold" onclick="setStatus(this)">보류</button>
        </div>
        <textarea placeholder="논의 내용 · 합의 사항"></textarea>
      </div>
    </div>`;
  }).join("");

  el.innerHTML = `
    <button class="head" onclick="toggle(this)">
      <span class="chev">▶</span>
      <span class="t">${sec.title}</span>
      <span class="cnt" data-cnt>0 / ${sec.items.length}</span>
    </button>
    <div class="body">${rows}</div>`;
  app.appendChild(el);
});

/* ---------- behaviour ---------- */
function toggle(btn){
  const s = btn.closest(".acc");
  s.hasAttribute("open") ? s.removeAttribute("open") : s.setAttribute("open","");
  s.querySelector(".body").style.display = s.hasAttribute("open") ? "" : "none";
  save();
}
function allOpen(v){
  document.querySelectorAll(".acc").forEach(s=>{
    v ? s.setAttribute("open","") : s.removeAttribute("open");
    s.querySelector(".body").style.display = v ? "" : "none";
  });
  save();
}
function setStatus(btn){
  const box = btn.closest(".item");
  const was = btn.classList.contains("on");
  box.querySelectorAll(".st").forEach(b=>b.classList.remove("on"));
  box.classList.remove("done","hold","re");
  if(!was){ btn.classList.add("on"); box.classList.add(btn.dataset.v); }
  refresh(); save();
}

function refresh(){
  const items = document.querySelectorAll(".item");
  document.querySelectorAll(".acc").forEach(s=>{
    const its = s.querySelectorAll(".item");
    const d = s.querySelectorAll(".item.done").length;
    s.querySelector("[data-cnt]").textContent = d + " / " + its.length;
  });
  const done = document.querySelectorAll(".item.done").length;
  const hold = document.querySelectorAll(".item.hold").length;
  const re   = document.querySelectorAll(".item.re").length;
  document.getElementById("stats").innerHTML =
    `<span class="pill">전체 ${items.length}</span>
     <span class="pill ok">합의 ${done}</span>
     <span class="pill re">추가 논의 ${re}</span>
     <span class="pill hold">보류 ${hold}</span>`;
}

/* ---------- persistence ---------- */
let timer=null;
function collect(){
  const st = {global:document.getElementById("global").value, open:{}, items:{}};
  document.querySelectorAll(".acc").forEach(s=> st.open[s.dataset.sec] = s.hasAttribute("open"));
  document.querySelectorAll(".item").forEach(b=>{
    const on = b.querySelector(".st.on");
    const memo = b.querySelector("textarea").value;
    if(on || memo) st.items[b.dataset.uid] = {s:on?on.dataset.v:"", m:memo};
  });
  return st;
}
function apply(st){
  if(!st) return;
  if(st.global!=null) document.getElementById("global").value = st.global;
  if(st.open) document.querySelectorAll(".acc").forEach(s=>{
    const v = st.open[s.dataset.sec];
    if(v===undefined) return;
    v ? s.setAttribute("open","") : s.removeAttribute("open");
    s.querySelector(".body").style.display = v ? "" : "none";
  });
  Object.entries(st.items||{}).forEach(([uid,v])=>{
    const b = document.querySelector('.item[data-uid="'+uid+'"]'); if(!b) return;
    if(v.s){ const t=b.querySelector('.st[data-v="'+v.s+'"]'); if(t){t.classList.add("on"); b.classList.add(v.s);} }
    if(v.m) b.querySelector("textarea").value = v.m;
  });
  refresh();
}
function save(){
  clearTimeout(timer);
  timer = setTimeout(()=>{
    try{
      localStorage.setItem(KEY, JSON.stringify(collect()));
      const t = new Date();
      document.getElementById("saved").textContent = "저장됨 " + t.toTimeString().slice(0,8);
    }catch(e){ document.getElementById("saved").textContent = "자동저장 불가 · HTML로 저장 사용"; }
  }, 350);
}
document.addEventListener("input", e=>{ if(e.target.matches("textarea")) save(); });

function resetAll(){
  if(!confirm("모든 메모와 상태를 지웁니다. 계속할까요?")) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  location.reload();
}

/* ---------- export ---------- */
function exportHTML(){
  const st = collect();
  document.getElementById("snapshot").textContent = JSON.stringify(st);
  document.querySelectorAll("textarea").forEach(t=>t.textContent = t.value);
  const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  document.querySelectorAll("textarea").forEach(t=>t.textContent = "");
  const d = new Date();
  const stamp = d.getFullYear() + ("0"+(d.getMonth()+1)).slice(-2) + ("0"+d.getDate()).slice(-2)
              + "_" + ("0"+d.getHours()).slice(-2) + ("0"+d.getMinutes()).slice(-2);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], {type:"text/html;charset=utf-8"}));
  a.download = "Micro-Jection_회의록_" + stamp + ".html";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* ---------- boot ---------- */
(function boot(){
  document.querySelectorAll(".acc").forEach(s=>{
    if(!s.hasAttribute("open")) s.querySelector(".body").style.display = "none";
  });
  let st = null;
  try{ st = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!st){ try{ st = JSON.parse(document.getElementById("snapshot").textContent); }catch(e){} }
  apply(st);
  refresh();
})();
</script>
</body>
